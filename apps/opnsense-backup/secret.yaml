apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: opnsense-backup-secret
  namespace: opnsense-backup
spec:
  refreshInterval: 10m
  secretStoreRef:
    name: secretstore-sample
    kind: ClusterSecretStore
  target:
    name: opnsense-backup-secret
    creationPolicy: Owner
  data:
    - secretKey: BACKUP_API_URL
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        key: homelab/prod/general/credentials
        property: opnsensebackups_backup_api_url
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        key: homelab/prod/general/credentials
        property: opnsensebackups_aws_access_key_id
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        key: homelab/prod/general/credentials
        property: opnsensebackups_aws_secret_access_key
    - secretKey: AWS_REGION
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        key: homelab/prod/general/credentials
        property: opnsensebackups_aws_region
    - secretKey: S3_BUCKET_NAME
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        key: homelab/prod/general/credentials
        property: opnsensebackups_s3_bucket_name
    - secretKey: OPNSENSE_API_KEY
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        key: homelab/prod/general/credentials
        property: opnsensebackups_opnsense_api_key
    - secretKey: OPNSENSE_SECRET_KEY
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        key: homelab/prod/general/credentials
        property: opnsensebackups_opnsense_secret_key
