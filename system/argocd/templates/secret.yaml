apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: homelab-private
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repo-creds
spec:
  refreshInterval: 10m
  secretStoreRef:
    name: secretstore-sample
    kind: ClusterSecretStore
  target:
    name: homelab-private
    creationPolicy: Owner
  data:
    - secretKey: type
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        key: homelab/prod/general/credentials
        property: argocd_repo_type
    - secretKey: sshPrivateKey
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        key: homelab/prod/general/credentials
        property: argocd_repo_ssh_private_key
    - secretKey: url
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        key: homelab/prod/general/credentials
        property: argocd_repo_git_url
