- name: Bootstrap osquery audit transport and forced collector
  hosts: bare
  gather_facts: false
  become: true
  serial: 1
  vars:
    audit_bootstrap_authorized: false
    audit_install_osquery: true
    audit_ssh_user: homelab-audit
    audit_controller_key_path: "{{ lookup('env', 'HOME') + '/.ssh/homelab-audit' }}"
    audit_base_dir: /opt/homelab-audit
    audit_force_command_path: "{{ audit_base_dir }}/remote/forced-collector.py"
    audit_query_pack_path: "{{ audit_base_dir }}/osquery/queries/approved.json"
    audit_keyring_path: /usr/share/keyrings/osquery-archive-keyring.gpg
    audit_repo_file: /etc/apt/sources.list.d/osquery.list
    audit_repo_url: "deb [signed-by={{ audit_keyring_path }}] https://pkg.osquery.io/deb deb main"
    audit_repo_key_url: https://pkg.osquery.io/deb/pubkey.gpg
  pre_tasks:
    - name: Reject unscoped or unauthorized audit bootstrap before contacting hosts
      ansible.builtin.assert:
        that:
          - (ansible_limit | default('') | length) > 0
          - audit_bootstrap_authorized | bool
        fail_msg: "Pass an explicit --limit and -e audit_bootstrap_authorized=true after operator review."
      delegate_to: localhost
      become: false
    - name: Ensure controller SSH directory exists
      ansible.builtin.file:
        path: "{{ audit_controller_key_path | dirname }}"
        state: directory
        mode: "0700"
      delegate_to: localhost
      become: false
      run_once: true
    - name: Generate audit SSH key pair on controller when missing
      ansible.builtin.command:
        cmd: >-
          ssh-keygen -t ed25519 -N '' -C homelab-audit -f {{ audit_controller_key_path }}
      args:
        creates: "{{ audit_controller_key_path }}"
      delegate_to: localhost
      become: false
      run_once: true
    - name: Read generated controller public key
      ansible.builtin.slurp:
        path: "{{ audit_controller_key_path }}.pub"
      register: audit_pubkey_slurp
      delegate_to: localhost
      become: false
      run_once: true
    - name: Share controller public key with all hosts in this play
      ansible.builtin.set_fact:
        audit_controller_public_key: "{{ audit_pubkey_slurp.content | b64decode | trim }}"
      run_once: true
  tasks:
    - name: Gather host facts after authorization checks
      ansible.builtin.setup:
    - name: Require Debian-family host
      ansible.builtin.assert:
        that: ansible_facts.os_family == "Debian"
        fail_msg: "Only Debian-family hosts are supported by this bootstrap."
    - name: Install osquery APT prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gpg
        state: present
        update_cache: true
      when: audit_install_osquery | bool
    - name: Download osquery APT repository key
      ansible.builtin.get_url:
        url: "{{ audit_repo_key_url }}"
        dest: /tmp/osquery.gpg.key
        mode: "0644"
      when: audit_install_osquery | bool
    - name: Install osquery keyring
      ansible.builtin.command:
        cmd: gpg --dearmor --yes -o {{ audit_keyring_path }} /tmp/osquery.gpg.key
      when: audit_install_osquery | bool
    - name: Configure osquery APT repository
      ansible.builtin.copy:
        dest: "{{ audit_repo_file }}"
        owner: root
        group: root
        mode: "0644"
        content: "{{ audit_repo_url }}\n"
      when: audit_install_osquery | bool
    - name: Install osquery package
      ansible.builtin.apt:
        name: osquery
        state: present
        update_cache: true
      when: audit_install_osquery | bool
    - name: Ensure audit base directories exist
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: root
        group: root
        mode: "{{ item.mode }}"
      loop:
        - { path: "{{ audit_base_dir }}", mode: "0755" }
        - { path: "{{ audit_base_dir }}/remote", mode: "0755" }
        - { path: "{{ audit_base_dir }}/osquery", mode: "0755" }
        - { path: "{{ audit_base_dir }}/osquery/queries", mode: "0755" }
    - name: Install forced collector wrapper
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../audit/remote/forced-collector.py"
        dest: "{{ audit_force_command_path }}"
        owner: root
        group: root
        mode: "0755"
    - name: Install approved query pack on host
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../audit/osquery/queries/approved.json"
        dest: "{{ audit_query_pack_path }}"
        owner: root
        group: root
        mode: "0644"
    - name: Ensure restricted audit user exists
      ansible.builtin.user:
        name: "{{ audit_ssh_user }}"
        create_home: true
        shell: /bin/bash
        state: present
    - name: Ensure audit SSH directory permissions
      ansible.builtin.file:
        path: "/home/{{ audit_ssh_user }}/.ssh"
        state: directory
        owner: "{{ audit_ssh_user }}"
        group: "{{ audit_ssh_user }}"
        mode: "0700"
    - name: Install forced-command audit key
      ansible.builtin.copy:
        dest: "/home/{{ audit_ssh_user }}/.ssh/authorized_keys"
        owner: "{{ audit_ssh_user }}"
        group: "{{ audit_ssh_user }}"
        mode: "0600"
        content: >-
          restrict,command="{{ audit_force_command_path }}"
          {{ audit_controller_public_key }}{{ '\n' }}
    - name: Verify forced collector availability
      ansible.builtin.command:
        cmd: "{{ audit_force_command_path }}"
      environment:
        SSH_ORIGINAL_COMMAND: homelab-audit version
      changed_when: false
