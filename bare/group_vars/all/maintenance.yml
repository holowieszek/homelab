os_maintenance_packages: []
os_maintenance:
  enabled: false
  approved: false
  automatic_updates: false
  reboot_allowed: false
  manual_approval_required: true
  max_parallel: 1
  update_scope: explicit_package_allowlist_only
  preflight: [operator_window, host_health]
  postflight: [ssh_reachable, service_health]
  kernel_updates: manual_separate_window
  k3s_upgrade: excluded
