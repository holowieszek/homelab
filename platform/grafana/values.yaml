grafana:
  admin:
    existingSecret: "grafana"
  envFromSecret: grafana

  sidecar:
    dashboards:
      enabled: true
      searchNamespace: monitoring
      label: grafana_dashboard
      labelValue: "1"
      provider:
        allowUiUpdates: true
    datasources:
      enabled: true
      searchNamespace: monitoring

  grafana.ini:
    server:
      root_url: https://grafana.internal.mateuszholowieszko.com

  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: "default"
          orgId: 1
          folder: "default"
          type: file
          disableDeletion: true
          editable: true
          options:
            path: /var/lib/grafana/dashboards/default

  dashboards:
    default:
      k3s:
        gnetId: 15282
        revision: 1
        datasource: Prometheus

      cloudnative-pg:
        gnetId: 20417
        revision: 3
        datasource: Prometheus

      cert-manager:
        gnetId: 20842
        revision: 3
        datasource: Prometheus

  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Home Assistant Postgres
          type: postgres
          access: proxy
          url: home-assistant-db-rw.home-assistant.svc.cluster.local:5432
          user: ${HOME_ASSISTANT_DB_USERNAME}
          database: ${HOME_ASSISTANT_DB_NAME}
          secureJsonData:
            password: ${HOME_ASSISTANT_DB_PASSWORD}
          jsonData:
            sslmode: disable
            postgresVersion: 1500
            timescaledb: false
          isDefault: false
          editable: true
          version: 1

  persistence:
    enabled: true
    storageClassName: longhorn
    accessModes:
      - ReadWriteOnce
    size: 10Gi
